[profile.default]
src = "assets/erc-adrf/contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = true
# The local EVM's code size limit, raised for test and script contracts only: the test contracts embed the creation
# code of every contract they deploy (about 150 KB each), the vendored ERC-8436 reference registry (test/vendor/acdf,
# a test fixture) exceeds EIP-170 by a few hundred bytes at optimizer runs 200 (its own repository compiles it with
# runs 1), and Foundry 1.7 applies this limit, and the initcode limit derived from it, to test and script contracts
# as well. Nothing deployed to a network depends on it: the ADRF contracts stay under 10 KB of runtime code
# (`forge build --sizes`) and the network enforces its own limit.
code_size_limit = 262144
remappings = [
  "forge-std/=lib/forge-std/src/",
  "adrf/=assets/erc-adrf/contracts/",
  "acdf/=test/vendor/acdf/",
]
fs_permissions = [
  { access = "read", path = "./assets/erc-adrf/vectors" },
  { access = "read", path = "./assets/erc-adrf/examples" },
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./out" },
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[lint]
lint_on_build = false
