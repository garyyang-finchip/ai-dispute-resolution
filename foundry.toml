[profile.default]
src = "assets/erc-adrf/contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = true
# The vendored ERC-8436 reference registry (test/vendor/acdf, a test fixture only) is compiled here with
# optimizer runs 200 and exceeds EIP-170 by a few hundred bytes (its own repository compiles it with runs 1).
# The limit is raised for the test EVM only; the ADRF contracts stay under 24,576 bytes
# (`forge build --sizes --skip test`).
code_size_limit = 32768
remappings = [
  "forge-std/=lib/forge-std/src/",
  "adrf/=assets/erc-adrf/contracts/",
  "acdf/=test/vendor/acdf/",
]
fs_permissions = [
  { access = "read", path = "./assets/erc-adrf/vectors" },
  { access = "read", path = "./assets/erc-adrf/examples" },
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./out" },
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[lint]
lint_on_build = false
